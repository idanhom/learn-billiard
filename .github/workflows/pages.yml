# Build the trainer and publish it to GitHub Pages on every push to main.
#
# One-time setup, in the repository's settings: Pages > Build and deployment >
# Source: GitHub Actions. The site then serves at
# https://idanhom.github.io/learn-billiard/ (Vite's base is './', so every
# asset path is relative and the sub-path needs no configuration).
#
# The browser verification (`npm run verify:browser`) is not run here: it needs
# a preview server and a Chromium, and it is part of the gate before every
# commit instead.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time. A newer push queues behind one already running
# rather than cancelling it halfway.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # `build` runs the typecheck first; the tests are the physics and the
      # progression, and a red one should never reach the site.
      - run: npm test
      - run: npm run build
      - uses: actions/configure-pages@v6.0.0
      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5.0.1
